[package]
name = "layeredcfg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/layeredcfg"
description = "Layered configuration: defaults from a TOML file, overridden by the user's TOML files, env-style files, the environment and the command line, each value converted to its default's type as Python converts text"
readme = "README.md"
keywords = ["configuration", "config", "dotenv", "env", "toml"]
categories = ["config"]
rust-version.workspace = true

[dependencies]
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "preserve_order"] }
libc = "0.2.191"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Each unsafe block does one thing and says why it holds.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# assert!(x.is_empty()) reads better than an assert_eq! with an empty array of a type spelt out.
assert_is_empty = "allow"
