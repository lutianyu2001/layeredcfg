[package]
name = "layeredcfg-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
layeredcfg = { path = "../layeredcfg" }
# The stable ABI: one wheel for every Python from 3.10, which reads Unicode as the Python that runs it does.
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
