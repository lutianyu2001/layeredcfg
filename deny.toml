# cargo deny check: known vulnerabilities, licenses, duplicate crates and where crates come from.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
all-features = false

[advisories]
# Every advisory is an error, unmaintained crates too; one that does not apply is listed in `ignore` with its reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with Apache-2.0, which this project is under.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
