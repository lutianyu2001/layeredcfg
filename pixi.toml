[workspace]
name = "layeredcfg"
version = "0.1.0"
description = "Layered configuration: defaults from a TOML file, overridden by env-style files, the environment and the command line"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Rust comes from rustup, at the version rust-toolchain.toml pins.
[dependencies]
python = "3.12.*"
maturin = ">=1.9,<2"
pip = "*"
pytest = ">=8"

[activation.env]
# Keep ~/.local site-packages out of the environment.
PYTHONNOUSERSITE = "1"
# The Python PyO3's build reads.
PYO3_PYTHON = "$CONDA_PREFIX/bin/python"

[tasks]
test-rust = { cmd = "cargo test --locked -p layeredcfg", description = "Run the Rust tests" }
lint = { cmd = "cargo fmt --all --check && cargo clippy --locked --workspace --all-targets -- -D warnings", description = "Check formatting and run clippy" }
# The Python package: built into a wheel in dist/ from the environment's own build tools (no download).
wheel = { cmd = "rm -rf dist && pip wheel . --no-build-isolation --no-deps -w dist", description = "Build the Python wheel into dist/" }
install-wheel = { cmd = "pip install --force-reinstall --no-deps dist/layeredcfg-*.whl", depends-on = ["wheel"], description = "Build the wheel and install it into this environment" }
test-python = { cmd = "python -m pytest -q tests/python", depends-on = ["install-wheel"], description = "Build and install the wheel, then run the Python tests" }
test = { depends-on = ["test-rust", "test-python"], description = "Run the Rust and the Python tests" }
# The files of a release for PyPI, from its tag: pixi run release-files <tag> (scripts/build-release.sh).
release-files = { cmd = "scripts/build-release.sh", description = "Build the sdist and the wheels of a tag into dist/" }
# The security audit, apart from the tests: pixi run audit <task> (cargo xtask, which lists the tasks).
audit = { cmd = "cargo xtask", description = "Run a task of the security audit (cargo xtask)" }
