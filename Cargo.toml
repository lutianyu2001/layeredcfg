[workspace]
members = ["crates/layeredconf", "crates/layeredconf-python", "xtask"]
# The audit (cargo xtask) is built only when it is run.
default-members = ["crates/layeredconf", "crates/layeredconf-python"]
# A workspace of its own, built with the nightly Rust by cargo fuzz.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
