[workspace]
members = ["crates/layeredcfg", "crates/layeredcfg-python", "xtask"]
# The security audit (cargo xtask) is built only when it is run.
default-members = ["crates/layeredcfg", "crates/layeredcfg-python"]
# A workspace of its own, built with the nightly Rust by cargo fuzz.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lutianyu2001/layeredcfg"
# The oldest Rust the crates build and pass their tests with (let chains); rust-toolchain.toml pins the one
# this repository is worked on with.
rust-version = "1.88"

# An integer that overflows panics, in the wheel too, instead of wrapping.
[profile.release]
overflow-checks = true
