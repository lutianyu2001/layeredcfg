[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "layeredcfg"
dynamic = ["version"]
description = "Layered configuration: defaults from a TOML file, overridden by env-style files, the environment and the command line, each value converted to its default's type"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
]

# The version is the Cargo workspace's (Cargo.toml).
[tool.maturin]
manifest-path = "crates/layeredcfg-python/Cargo.toml"
python-source = "python"
module-name = "layeredcfg._core"
locked = true
strip = true
