[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "layeredcfg"
dynamic = ["version"]
description = "Layered configuration: defaults from a TOML file, overridden by env-style files, the environment and the command line, each value converted to its default's type"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tianyu (Sky) Lu" }]
keywords = ["configuration", "config", "dotenv", "env", "toml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/lutianyu2001/layeredcfg"
Issues = "https://github.com/lutianyu2001/layeredcfg/issues"
Security = "https://github.com/lutianyu2001/layeredcfg/blob/main/SECURITY.md"

# The version is the Cargo workspace's (Cargo.toml).
[tool.maturin]
manifest-path = "crates/layeredcfg-python/Cargo.toml"
python-source = "python"
module-name = "layeredcfg._core"
locked = true
strip = true
# The Python tests go into the source distribution, for those who build from it (conda-forge) to run.
include = [{ path = "tests/python/**/*.py", format = "sdist" }]
